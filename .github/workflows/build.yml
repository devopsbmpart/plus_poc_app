name: build

# 플랫폼이 workflow_dispatch 로 실행한다.
# 브랜치 명명 규칙에 의존하지 않도록 이슈 키와 이미지 좌표를 inputs 로 받는다.
on:
  workflow_dispatch:
    inputs:
      jira_issue:
        description: 'Jira Issue Key'
        required: false
        default: ''
      image_repository:
        description: '이미지 저장소 (ghcr.io/owner/name)'
        required: false
        default: ''
      image_tag:
        description: '이미지 태그'
        required: false
        default: ''
      target_env:
        description: '대상 환경 (stg/prd)'
        required: false
        default: ''
  push:
    branches: ['**']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      issue: ${{ steps.correlate.outputs.issue }}
    steps:
      - uses: actions/checkout@v4

      # 상관관계 키는 inputs 가 우선이다. 사람이 만든 브랜치는 이름에 키가 없다.
      # 없으면 브랜치명 → 커밋 trailer 순으로 물러난다.
      - id: correlate
        name: 좌표 결정
        run: |
          KEY="${{ inputs.jira_issue }}"
          if [ -z "$KEY" ]; then
            KEY=$(printf '%s' "${GITHUB_REF_NAME}" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
          fi
          if [ -z "$KEY" ]; then
            KEY=$(git log -1 --pretty=%B | grep -oE '^[A-Z][A-Z0-9]+-[0-9]+$' | head -1 || true)
          fi

          REPO="${{ inputs.image_repository }}"
          [ -z "$REPO" ] && REPO="ghcr.io/${GITHUB_REPOSITORY}"

          TAG="${{ inputs.image_tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_SHA}"

          echo "issue=$KEY"  >> "$GITHUB_OUTPUT"
          echo "image=$REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"    >> "$GITHUB_OUTPUT"
          echo "Issue=${KEY:-(없음)}  Image=$REPO:$TAG  Env=${{ inputs.target_env }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 규칙 4 — 배포는 tag 가 아니라 digest 로 고정한다.
      # 여기서는 digest 를 출력으로 내보내고 GitOps 커밋은 플랫폼이 한다.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.correlate.outputs.image }}:${{ steps.correlate.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            jira.issue=${{ steps.correlate.outputs.issue }}

      - name: 결과 요약
        run: |
          {
            echo "### 빌드 결과"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Jira Issue | ${{ steps.correlate.outputs.issue }} |"
            echo "| 환경 | ${{ inputs.target_env }} |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
