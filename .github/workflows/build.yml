name: build

# 플랫폼이 만든 브랜치에 push 되면 이미지를 빌드한다.
# workflow_run 으로 플랫폼이 이 실행을 수집한다 (S4).
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      issue: ${{ steps.correlate.outputs.issue }}
    steps:
      - uses: actions/checkout@v4

      # 상관관계 키 추출. 브랜치명이 먼저고, 없으면 커밋 메시지 trailer 를 본다.
      # 둘 다 없으면 빈 값으로 두고 계속 진행한다. 여기서 실패시키면
      # 플랫폼을 거치지 않은 수동 push 가 전부 막힌다.
      - id: correlate
        name: Jira Issue Key 추출
        run: |
          KEY=$(printf '%s' "${GITHUB_REF_NAME}" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
          if [ -z "$KEY" ]; then
            KEY=$(git log -1 --pretty=%B | grep -oE '^[A-Z][A-Z0-9]+-[0-9]+$' | head -1 || true)
          fi
          echo "issue=$KEY" >> "$GITHUB_OUTPUT"
          echo "추출된 Issue Key: ${KEY:-(없음)}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그가 아니라 digest 로 고정하는 것이 규칙 4 다.
      # 여기서는 digest 를 출력으로 내보내고, GitOps 커밋은 플랫폼이 한다 (S6).
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            jira.issue=${{ steps.correlate.outputs.issue }}

      - name: 결과 요약
        run: |
          {
            echo "### 빌드 결과"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Jira Issue | ${{ steps.correlate.outputs.issue }} |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Revision | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"
