name: stg-build

# GitHub Actions API의 workflow_dispatch로만 실행한다.
run-name: "[${{ inputs.ticket_no }}] ${{ inputs.repository_name }}"
on:
  workflow_dispatch:
    inputs:
      ticket_no:
        description: 티켓 번호
        required: true
        type: string
      repository_name:
        description: 저장소 이름
        required: true
        type: string
      image_tag:
        description: 이미지 태그
        required: false
        type: string

# 소스 조회만 허용한다. Docker Hub 인증은 Secret을 사용한다.
permissions:
  contents: read

concurrency:
  group: build-01-gitops
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ format('docker.io/scmkim/{0}', inputs.repository_name || github.event.repository.name) }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      # MANIFEST_PATH는 GitOps 저장소 기준 경로다.
      # NOTE: MANIFEST REPO 수정시 변경 필요
      MANIFEST_REPO: devopsbmpart/plus_poc_gitops
      MANIFEST_REF: main
      MANIFEST_CHECKOUT_PATH: gitops
      MANIFEST_PATH: apps/plus-poc-app-stg/deployment.yaml

    steps:
      #############################
      ### Checkout Source #########
      #############################
      - uses: actions/checkout@v4

      # NOTE: 레지스트리 수정시 변경 필요
      ##############################
      ### Login Registry: GHCR #####
      ##############################
      # GHCR 로그인: 임시 비활성화.
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      ####################################
      ### Login Registry: Docker Hub #####
      ####################################
      # Docker Hub에 로그인한다.
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #############################
      ### Build / Push ############
      #############################
      # 이미지를 빌드하고 Docker Hub에 push한다.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}








      ##########################################
      ### Checkout Manifest Repository #########
      ##########################################
      # Manifest Repository 저장소를 checkout한다.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ref: ${{ env.MANIFEST_REF }}
          token: ${{ secrets.REPOSITORY_ACCESS_TOKEN }}
          path: ${{ env.MANIFEST_CHECKOUT_PATH }}


      #############################
      ### Update Manifest #########
      #############################
      # STG 배포 이미지와 티켓 번호를 갱신한다.
      - name: Update STG manifest file
        uses: mikefarah/yq@v4.53.2
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TICKET_KEY: ${{ inputs.ticket_no }}
        with:
          cmd: |
            manifest="$MANIFEST_CHECKOUT_PATH/$MANIFEST_PATH"
            test -f "$manifest" && test -n "$DIGEST"
            # Argo CD Application이 참조하는 Manifest 저장소의
            # STG Deployment manifest에서 app 컨테이너 설정을 갱신한다.
            # 1. image: 저장소와 digest를 결합해 배포 이미지를 고정한다.
            # 2. IMAGE_DIGEST: 현재 배포 이미지의 digest를 기록한다.
            # 3. TICKET_KEY: 배포를 요청한 티켓 번호를 기록한다.
            yq -i '
              (.spec.template.spec.containers[] | select(.name == "app")) |= (
                .image = strenv(IMAGE_REPOSITORY) + "@" + strenv(DIGEST) |
                (.env[] | select(.name == "IMAGE_DIGEST").value) = strenv(DIGEST) |
                (.env[] | select(.name == "TICKET_KEY").value) = strenv(TICKET_KEY)
              )
            ' "$manifest"

      #############################
      ### Commit and Push #########
      #############################
      # 변경된 경우에만 STG manifest를 push한다.
      - name: Commit and push STG manifest
        working-directory: ${{ env.MANIFEST_CHECKOUT_PATH }}
        env:
          TICKET_NO: ${{ inputs.ticket_no }}
          REPOSITORY_NAME: ${{ inputs.repository_name }}
        run: |
          git add "$MANIFEST_PATH"

          git diff --cached --quiet && {
            echo "Manifest is already up to date."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(deploy): [$TICKET_NO] [stg] $REPOSITORY_NAME"
          git pull --rebase origin "$MANIFEST_REF"
          git push origin "HEAD:$MANIFEST_REF"
