name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      image_repository:
        description: '이미지 저장 위치 (예: ghcr.io/owner/repo)'
        required: false
        type: string
      image_tag:
        description: '이미지 태그'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ inputs.image_repository || format('ghcr.io/{0}', github.repository) }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Show result
        run: |
          echo "Image: ${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          echo "Digest: ${{ steps.push.outputs.digest }}"
